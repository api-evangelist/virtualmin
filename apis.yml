aid: virtualmin
name: Virtualmin
description: >-
  Virtualmin is an open-source web hosting control panel for Linux and BSD, built
  on top of Webmin, that lets administrators and resellers manage websites, virtual
  servers, DNS, email, FTP, databases, SSL certificates, WordPress and more from a
  single interface. Distributed as a community GPL edition and a commercial Pro
  edition, Virtualmin (with its sibling Cloudmin for VM/cloud management) has run
  for 20+ years and manages over a million domains across 200K+ active users. For
  automation it exposes a command-line API and an HTTP-based Remote API served from
  Webmin's remote.cgi on port 10000, covering ~200 documented programs for creating
  and modifying virtual servers, users, aliases, databases, resellers, plans,
  templates, SSL certs, backups and cloud storage, with plain-text, JSON, XML or
  Perl output.
